[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyrock-modeling"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas", "numpy", "scipy", "scikit-learn", "statsmodels", "pydantic>=2",
  "pyyaml", "plotly", "matplotlib", "streamlit", "jinja2", "openpyxl",
  "python-docx", "pytest", "ruff", "mypy"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
